<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.collection == "posts" %}{{ page.date | date: "%B %-d, %Y" }} · {% elsif page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
          <span class="wordmark-icon" aria-hidden="true">✳</span>
          <span>{{ site.title }}</span>
        </a>
        <span class="header-note">notes from the end of the world</span>
      </header>

      <main>{{ content }}</main>

      <footer class="site-footer">
        <span>Written day by day, wherever we are.</span>
        <a href="{{ '/' | relative_url }}">Back to the beginning ↑</a>
      </footer>
    </div>
  </body>
</html>
